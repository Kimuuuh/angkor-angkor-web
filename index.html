<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angkor & Angkor — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <img class="brand-logo" src="img/logo.svg" alt="Logo Angkor &amp; Angkor">
    <div class="brand">
      <span class="brand-name">Angkor & Angkor</span>
      <span class="brand-tag">Spécialités Khmères</span>
    </div>
  </div>
</header>

<!-- ================= PAGE D'ACCUEIL : CATEGORIES ================= -->
<main id="view-home" class="view">
  <section class="hero">
    <h1>Notre carte</h1>
    <p>Choisissez une catégorie pour découvrir nos plats</p>
  </section>

  <section class="categories">
    <button class="cat-card" data-cat="entrees">
      <span class="cat-icon">🥟</span>
      <span class="cat-name">Entrées</span>
      <span class="cat-count"></span>
    </button>
    <button class="cat-card" data-cat="specialites">
      <span class="cat-icon">🍲</span>
      <span class="cat-name">Spécialités</span>
      <span class="cat-count"></span>
    </button>
    <button class="cat-card" data-cat="plats">
      <span class="cat-icon">🍛</span>
      <span class="cat-name">Plats</span>
      <span class="cat-count"></span>
    </button>
    <button class="cat-card" data-cat="assiettes">
      <span class="cat-icon">🍽️</span>
      <span class="cat-name">Assiettes</span>
      <span class="cat-count"></span>
    </button>
    <button class="cat-card" data-cat="accompagnements">
      <span class="cat-icon">🍚</span>
      <span class="cat-name">Accompagnements</span>
      <span class="cat-count"></span>
    </button>
    <button class="cat-card" data-cat="desserts">
      <span class="cat-icon">🍧</span>
      <span class="cat-name">Desserts</span>
      <span class="cat-count"></span>
    </button>
  </section>

  <footer class="restaurant-info">
    <p class="addr">📍 128 avenue du Maine, 75014 Paris</p>
    <p class="tel">📞 01 42 78 03 51</p>
  </footer>
</main>

<!-- ================= PAGE CATEGORIE (contenu injecté par JS) ================= -->
<main id="view-category" class="view" hidden>
  <div class="cat-header">
    <button id="back-btn" class="back-btn">← Retour</button>
    <h1 id="cat-title"></h1>
  </div>
  <div id="dish-list" class="dish-list"></div>
</main>

<script src="menu-data.js"></script>
<script src="app.js"></script>
</body>
</html>
